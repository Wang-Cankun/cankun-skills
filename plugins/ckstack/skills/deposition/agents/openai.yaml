interface:
  display_name: "Deposition"
  short_description: "Shape shared intent, decisions, and acceptance criteria"
  default_prompt: "Use $deposition to help me think this task through: investigate the available context, develop a shared understanding of the purpose and consequential choices with me, and establish useful acceptance criteria, verification, and decision boundaries. If I bring a plan or result, examine it against that understanding."

policy:
  allow_implicit_invocation: true
