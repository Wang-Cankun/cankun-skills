interface:
  display_name: "Deposition"
  short_description: "Build a shared mental model and test its fitness for purpose"
  default_prompt: "Use $deposition to build a shared mental model with me. Explain your interpretation in your own words, contribute independent judgment, and help surface what matters but remains unspoken. Test that understanding against the intended use before settling the next action."

policy:
  allow_implicit_invocation: true
