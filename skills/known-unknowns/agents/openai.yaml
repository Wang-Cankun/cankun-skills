interface:
  display_name: "Known Unknowns"
  short_description: "Articulate tacit judgment and connect what has gone unnoticed"
  default_prompt: "Use $known-unknowns to explore this with me. Help put words to what I am trying to express, connect relevant knowledge I may not have brought to bear, and investigate consequential blind spots. Offer interpretations I can recognize or correct, using the Rumsfeld matrix to guide the exploration."

policy:
  allow_implicit_invocation: true
